<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3D405B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>ART Simulator — Cozy Homekeeper</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at top, #f7ede2 0%, #e6d5c3 100%);
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        touch-action: none;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
        overscroll-behavior: none;
        border-radius: 14px;
        box-shadow: 0 20px 50px rgba(61, 64, 91, 0.22);
      }
      #three-layer {
        position: fixed;
        pointer-events: none;
        z-index: 1;
        border-radius: 14px;
        box-shadow: none;
      }
      #app > canvas {
        position: relative;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
